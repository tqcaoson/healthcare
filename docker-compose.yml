version: '3.9'

services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./docker/healthcare:/var/www/html
    env_file:
      - ./docker/healthcare/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started
    networks:
      - healthcare

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/healthcare:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - healthcare

  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: healthcare
      MYSQL_USER: healthcare
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - healthcare

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - healthcare

  meilisearch:
    image: getmeili/meilisearch:v1.8
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: masterKey
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - healthcare

  node:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./docker/healthcare:/app
    command: sh -c "npm install && npm run build"
    profiles:
      - build

volumes:
  mysql_data:
  meilisearch_data:

networks:
  healthcare:
    driver: bridge
